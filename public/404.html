<!doctype html>

<html lang="zh-TW">

  <head>

    <title>找不到頁面（404 Not Found）</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">

    <style>

      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      html {
        font-size: 16px;
      }

      body {
        background: #FFF;
        color: #261B23;
        display: grid;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Roboto, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: clamp(1rem, 2.5vw, 2rem);
        -webkit-font-smoothing: antialiased;
        font-style: normal;
        font-weight: 400;
        letter-spacing: -0.0025em;
        line-height: 1.4;
        min-height: 100dvh;
        place-items: center;
        text-rendering: optimizeLegibility;
        -webkit-text-size-adjust: 100%;
      }

      a {
        color: inherit;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 0.0925em;
      }

      main {
        display: grid;
        gap: 1em;
        padding: 2em;
        place-items: center;
        text-align: center;
      }

      main header {
        width: min(100%, 12em);
      }

      main header img {
        height: auto;
        max-width: 100%;
        width: 100%;
      }

      main article {
        width: min(100%, 30em);
      }

      main article h1 {
        font-size: 200%;
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      main article p {
        font-size: 75%;
        margin-top: 0.5em;
      }

      main nav {
        font-size: 75%;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #101010;
          color: #e0e0e0;
        }
      }

    </style>

  </head>

  <body>

    <!-- This file lives in public/404.html -->

    <main>
      <header>
        <img src="/404-error.png" alt="404">
      </header>
      <article>
        <h1>404</h1>
        <p>抱歉，您要找的頁面不存在。可能是網址輸入錯誤，或這個頁面已經被移除了。</p>
      </article>
      <nav>
        <a href="/tasks">回任務列表</a>
      </nav>
    </main>

  </body>

</html>

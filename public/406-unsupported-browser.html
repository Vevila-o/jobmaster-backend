    <meta name="robots" content="noindex, nofollow">

    <style>

      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      html {
        font-size: 16px;
      }

      body {
        background: #FFF;
        color: #261B23;
        display: grid;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Roboto, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;

        -webkit-text-size-adjust: 100%;

      a {
        color: inherit;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 0.0925em;
      }

        display: grid;
        gap: 1em;
        padding: 2em;
        place-items: center;
        text-align: center;
      }

      main header {
        width: min(100%, 12em);
      }

      main header img {
        height: auto;
        max-width: 100%;
        width: 100%;
      }

      main article {
        width: min(100%, 30em);
      }

      main article h1 {
        font-size: 150%;
        font-weight: 700;
      }

      main article p {
        font-size: 75%;

      }

      main nav {
        display: flex;
        flex-wrap: wrap;
        font-size: 75%;
        gap: 1em;
        justify-content: center;

      @media (prefers-color-scheme: dark) {

        }

    <main>
